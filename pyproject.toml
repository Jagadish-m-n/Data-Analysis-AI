[project]
name = "data-analysis-ai"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.7.32",
    "fastapi==0.135.1",
    "langchain>=1.4.7,<2.0.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langsmith>=0.14.12",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.15.0",
    "python-dotenv>=1.2.4",
    "python-multipart==0.0.22",
    "requests==2.34.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "structlog==26.1.0",
    "uvicorn==0.41.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
